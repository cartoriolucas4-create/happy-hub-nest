name: one-time-dashboard-fix
on:
  push:
    paths:
      - '.github/workflows/one-time-dashboard-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'fix: refresh dashboard financial data')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/routes/_authenticated/admin.index.tsx')
          text = path.read_text()
          start = text.index('  const { data: finance, error: financeError } = useQuery(')
          end = text.index('  const online = Number(finance?.online_revenue', start)
          replacement = '''  const { data: finance, error: financeError } = useQuery({ queryKey: ["financial-summary-direct", shop?.id, financeDates.from, financeDates.to], enabled: Boolean(shop?.id), staleTime: 0, refetchOnWindowFocus: true, refetchInterval: 5000, queryFn: async () => {
    const db = supabase as any;
    const [onlineRes, externalRes, expenseRes] = await Promise.all([
      db.from("appointments").select("valor,payment_received_at,status").eq("barbershop_id", shop!.id).not("payment_received_at", "is", null).in("status", ["confirmado", "concluido"]).gte("payment_received_at", `${financeDates.from}T00:00:00-03:00`).lte("payment_received_at", `${financeDates.to}T23:59:59.999-03:00`),
      db.from("external_sales").select("id,total,sold_at").eq("barbershop_id", shop!.id).eq("status", "finalizada").gte("sold_at", `${financeDates.from}T00:00:00-03:00`).lte("sold_at", `${financeDates.to}T23:59:59.999-03:00`),
      db.from("business_costs").select("amount,cost_date").eq("barbershop_id", shop!.id).gte("cost_date", financeDates.from).lte("cost_date", financeDates.to),
    ]);
    if (onlineRes.error) throw onlineRes.error;
    if (externalRes.error) throw externalRes.error;
    if (expenseRes.error) throw expenseRes.error;
    const onlineRevenue = (onlineRes.data ?? []).reduce((sum: number, row: any) => sum + Number(row.valor ?? 0), 0);
    const externalRevenue = (externalRes.data ?? []).reduce((sum: number, row: any) => sum + Number(row.total ?? 0), 0);
    const expenses = (expenseRes.data ?? []).reduce((sum: number, row: any) => sum + Number(row.amount ?? 0), 0);
    const saleIds = (externalRes.data ?? []).map((sale: any) => sale.id).filter(Boolean);
    let productCost = 0;
    if (saleIds.length) {
      const { data: items, error: itemsError } = await db.from("external_sale_items").select("quantity,unit_cost_snapshot,product_id,external_products(cost_price)").in("sale_id", saleIds).not("product_id", "is", null);
      if (itemsError) throw itemsError;
      productCost = (items ?? []).reduce((sum: number, item: any) => {
        const snapshot = Number(item.unit_cost_snapshot ?? 0);
        const currentCost = Number(item.external_products?.cost_price ?? 0);
        return sum + (snapshot > 0 ? snapshot : currentCost) * Number(item.quantity ?? 0);
      }, 0);
    }
    const revenue = onlineRevenue + externalRevenue;
    return { online_revenue: onlineRevenue, external_revenue: externalRevenue, expenses, product_cost: productCost, costs: expenses + productCost, total_revenue: revenue, net_profit: revenue - expenses - productCost };
  } });
'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Commit dashboard fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/one-time-dashboard-fix.yml
          git add src/routes/_authenticated/admin.index.tsx .github/workflows/one-time-dashboard-fix.yml
          git commit -m "fix: refresh dashboard financial data"
          git push